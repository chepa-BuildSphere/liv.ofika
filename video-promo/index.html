<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"brandOrange","type":"color","label":"Orange Ofika","default":"#C2410C"},
    {"id":"brandGreen","type":"color","label":"Vert Certifié","default":"#15803D"},
    {"id":"priceLabel","type":"string","label":"Tarif par livraison","default":"10 F CFA"},
    {"id":"ctaText","type":"string","label":"Bouton Call-To-Action","default":"Créer mon compte gratuit → ofika.ci"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ofika Delivery — Spot Publicitaire 20s (AIDA · Abidjan)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #scene-1-hook,
      #scene-2-story,
      #scene-3-proof,
      #scene-4-cta {
        z-index: 10;
      }
      #captions-track {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ofika-ad-20s"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-duration="20"
    >
      <!-- ACTE 1 : ATTENTION (Intro & Hook : 0.0s -> 4.0s) -->
      <div
        id="scene-1-hook"
        class="clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACTE 2 : INTÉRÊT (Histoire & Bascule 3D : 4.0s -> 9.0s) -->
      <div
        id="scene-2-story"
        class="clip"
        data-composition-id="scene-2-story"
        data-composition-src="compositions/scene-2-story.html"
        data-start="4"
        data-duration="5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACTE 3 : DÉSIR (Développement & Preuve 10 F : 9.0s -> 17.0s) -->
      <div
        id="scene-3-proof"
        class="clip"
        data-composition-id="scene-3-proof"
        data-composition-src="compositions/scene-3-proof.html"
        data-start="9"
        data-duration="8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACTE 4 : ACTION (Conclusion, Texte, Logo & CTA — 3 dernières secondes : 17.0s -> 20.0s) -->
      <div
        id="scene-4-cta"
        class="clip"
        data-composition-id="scene-4-cta"
        data-composition-src="compositions/scene-4-cta.html"
        data-start="17"
        data-duration="3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- PISTE UNIQUE DE SOUS-TITRES SYNCHRONISÉS (0.0s -> 20.0s) -->
      <div
        id="captions-track"
        class="clip"
        data-composition-id="captions-track"
        data-composition-src="compositions/captions-track.html"
        data-start="0"
        data-duration="20"
        data-track-index="1"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- BUS & PISTES AUDIO : Voix-off féminine au 1er plan + Mélodie douce sculptée par Voiceover Carve -->
      <hf-audio-group
        id="voiceover"
        data-label="Voix-Off Féminine"
        data-volume="1"
      ></hf-audio-group>

      <audio
        id="vo-main"
        src="assets/vo-female-fr.wav"
        data-audio-group="voiceover"
        data-start="0.10"
        data-duration="19.7"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <audio
        id="bgm-bed"
        src="assets/bgm-afro-soft.wav"
        data-start="0"
        data-duration="20"
        data-track-index="3"
        data-volume="0.14"
        data-fx-carve='{"enabled":true,"sources":["voiceover"],"strength":0.8,"dynamic":true}'
        data-fx-chain='{"version":1,"nodes":[{"type":"peaking","id":"c1","fromCarve":true,"params":{"frequency":400,"gain":-7.4,"q":2}},{"type":"peaking","id":"c2","fromCarve":true,"params":{"frequency":1000,"gain":-8.2,"q":2}},{"type":"peaking","id":"c3","fromCarve":true,"params":{"frequency":1600,"gain":-14.8,"q":2}},{"type":"peaking","id":"c4","fromCarve":true,"params":{"frequency":2500,"gain":-7.4,"q":2}}]}'
      ></audio>

      <audio
        id="sfx-cues"
        src="assets/sfx-cues.wav"
        data-start="0"
        data-duration="20"
        data-track-index="4"
        data-volume="0.32"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["ofika-ad-20s"] = tl;
    </script>
  </body>
</html>
